events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Subidas de imágenes a la API (el límite real del multer es 10 MB).
  client_max_body_size 15m;

  upstream web {
    server web:3000;
  }

  upstream api {
    server api:4001;
  }

  # Umami (analitica propia) vive en el LXC 119 del homelab.
  upstream umami {
    server 192.168.1.119:3000;
  }

  server {
    listen 80;
    server_name _;

    location /uploads/posts/ {
      alias /var/www/uploads/;
      try_files $uri =404;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    # Tracker de Umami servido bajo el mismo origen del sitio: el script
    # (/analytics/script.js) deduce de su propio src que envia los eventos a
    # /analytics/api/send, asi que basta con recortar el prefijo.
    # El panel de Umami NO se expone aqui: se abre en http://192.168.1.119:3000.
    location /analytics/ {
      proxy_pass http://umami/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
